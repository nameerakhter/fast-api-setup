[project]
name = "nata-chatbot"
version = "0.1.0"
description = "NATA 2026 public chatbot: FastAPI + Streamlit + Gemini + Qdrant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "qdrant-client>=1.12.0",
    "pydantic>=2.0.0",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
]

# From project root (with venv activated):
#   pip install -r requirements.txt
#   cd server && python scripts/generate_embeddings.py
#   cd server && uvicorn main:app --reload
#   cd client && streamlit run app.py
