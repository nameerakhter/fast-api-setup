[project]
name = "course-store"
version = "0.1.0"
description = "Teaching project: PyMongo + FastAPI + Streamlit"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
]

# From project root (with venv activated):
#   pip install -r requirements.txt
#   cd server && python mongodb_steps.py
#   cd server && uvicorn main:app --reload
#   cd client && streamlit run app.py
